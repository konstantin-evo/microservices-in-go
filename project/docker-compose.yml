version: '3'

services:

# api services
  broker-service:
    image: konstantinevo/microservices-in-go-broker:1.0.0
    restart: always
    ports:
      - "8080:80"
    deploy:
      mode: replicated
      replicas: 1

  front-service:
    image: konstantinevo/microservices-in-go-frontend:1.0.0
    restart: always
    ports:
      - "80:80"
    deploy:
      mode: replicated
      replicas: 1

  logger-service:
    image: konstantinevo/microservices-in-go-logger:1.0.0
    restart: always
    deploy:
      mode: replicated
      replicas: 1

  authentication-service:
    image: konstantinevo/microservices-in-go-authentication:1.0.0
    restart: always
    ports:
      - "8082:80"
    deploy:
      mode: replicated
      replicas: 1
    environment:
      DSN: "host=postgres port=5432 user=postgres password=password dbname=users sslmode=disable timezone=UTC connect_timeout=5"

  mailer-service:
    image: konstantinevo/microservices-in-go-mailer:1.0.0
    restart: always
    deploy:
      mode: replicated
      replicas: 1
    environment:
      MAIL_DOMAIN: localhost
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_ENCRYPTION: none
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      FROM_NAME: "Konstantin Evo"
      FROM_ADDRESS: konstantin.evo@example.com

  listener-service:
    image: konstantinevo/microservices-in-go-listener:1.0.0
    deploy:
      mode: replicated
      replicas: 1

# monitoring services
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./src/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./db-data/prometheus:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.4
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DATASOURCE=prometheus
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./src/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./db-data/grafana:/var/lib/grafana
    restart: always
    depends_on:
      - prometheus

# utility services
  mailhog:
    image: 'mailhog/mailhog:v1.0.1'
    ports:
      - "1025:1025"
      - "8025:8025"

  rabbitmq:
    image: 'rabbitmq:3.9-management-alpine'
    ports:
      - "15672:15672"
      - "5672:5672"
    deploy:
      mode: replicated
      replicas: 1
    volumes:
      - ./db-data/rabbitmq/:/var/lib/rabbitmq/

  postgres:
    image: 'postgres:14.2'
    ports:
      - "5432:5432"
    restart: always
    deploy:
      mode: replicated
      replicas: 1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: users
    volumes:
      - ./db-data/postgres/:/var/lib/postgresql/data/
      - ./src/script/init.sql:/docker-entrypoint-initdb.d/init.sql

  mongo:
    image: 'mongo:4.2.16-bionic'
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: logs
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - ./db-data/mongo/:/data/db
  
  db-adminer:
    image: 'adminer:4.8.1'
    restart: always
    ports:
      - "8089:8080"
